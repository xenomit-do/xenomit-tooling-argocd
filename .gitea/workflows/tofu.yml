name: OpenTofu

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  plan:
    if: ${{ gitea.event_name == 'pull_request' && gitea.event.pull_request.head.repo.full_name == gitea.repository && gitea.event.pull_request.user.login == 'gitops' }}
    runs-on: xenomit
    env:
      PROJECT_KEY: argocd
      GITEA_OWNER: gitops
      GITEA_PACKAGE_USER: gitops
      GITEA_BASE_URL: ${{ vars.GITEA_BASE_URL }}
      STATE_PACKAGE: xenomit-platform-argocd-state
      PLAN_PACKAGE: xenomit-platform-argocd-plans
      LOCK_PACKAGE: xenomit-platform-argocd-lock
      PR_NUMBER: ${{ gitea.event.pull_request.number }}
      PR_HEAD_SHA: ${{ gitea.event.pull_request.head.sha }}
      GITEA_PACKAGE_TOKEN: ${{ secrets.GITEA_PACKAGE_TOKEN }}
      TOFU_ARTIFACT_ENCRYPTION_KEY: ${{ secrets.TOFU_ARTIFACT_ENCRYPTION_KEY }}
      TOFU_ARTIFACT_HMAC_KEY: ${{ secrets.TOFU_ARTIFACT_HMAC_KEY }}
      TF_VAR_argocd_auth_token: ${{ secrets.ARGOCD_READ_AUTH_TOKEN }}
      TF_VAR_repository_url: ${{ vars.ARGOCD_REPOSITORY_URL }}
      TF_VAR_source_revision: ${{ gitea.event.pull_request.head.sha }}
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ gitea.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install pinned OpenTofu
        run: |
          bash scripts/ci/install-opentofu.sh
          echo "$RUNNER_TEMP/bin" >> "$GITEA_PATH"
      - name: Plan
        run: bash scripts/ci/plan.sh

  apply:
    if: ${{ gitea.event_name == 'issue_comment' && gitea.event.is_pull && gitea.event.comment.body == '/tofu apply' && gitea.event.sender.login == 'gitops' }}
    runs-on: xenomit
    env:
      PROJECT_KEY: argocd
      GITEA_OWNER: gitops
      GITEA_PACKAGE_USER: gitops
      GITEA_BASE_URL: ${{ vars.GITEA_BASE_URL }}
      STATE_PACKAGE: xenomit-platform-argocd-state
      PLAN_PACKAGE: xenomit-platform-argocd-plans
      LOCK_PACKAGE: xenomit-platform-argocd-lock
      PR_NUMBER: ${{ gitea.event.issue.number }}
      GITEA_WRITE_TOKEN: ${{ secrets.GITEA_WRITE_TOKEN }}
      GITEA_PACKAGE_TOKEN: ${{ secrets.GITEA_PACKAGE_TOKEN }}
      TOFU_ARTIFACT_ENCRYPTION_KEY: ${{ secrets.TOFU_ARTIFACT_ENCRYPTION_KEY }}
      TOFU_ARTIFACT_HMAC_KEY: ${{ secrets.TOFU_ARTIFACT_HMAC_KEY }}
      TF_VAR_argocd_auth_token: ${{ secrets.ARGOCD_WRITE_AUTH_TOKEN }}
      TF_VAR_repository_url: ${{ vars.ARGOCD_REPOSITORY_URL }}
    steps:
      - name: Check out trusted workflow helpers
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install pinned OpenTofu
        run: |
          bash scripts/ci/install-opentofu.sh
          echo "$RUNNER_TEMP/bin" >> "$GITEA_PATH"
      - name: Apply exact plan and merge
        run: bash scripts/ci/apply.sh
