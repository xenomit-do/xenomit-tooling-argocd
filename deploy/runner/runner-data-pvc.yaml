apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xenomit-actions-runner-data
  namespace: ci
  labels:
    app.kubernetes.io/part-of: xenomit
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  volumeMode: Filesystem
  resources:
    requests:
      storage: 2Gi
