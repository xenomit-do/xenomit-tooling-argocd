apiVersion: v1
kind: ConfigMap
metadata:
  name: xenomit-actions-runner-config
  namespace: ci
  labels:
    app.kubernetes.io/part-of: xenomit
data:
  config.yaml: |
    log:
      level: info
    runner:
      file: /data/.runner
      capacity: 5
      timeout: 3h
      labels:
        - "xenomit:docker://docker.gitea.com/runner-images:ubuntu-latest"
    container:
      network: host
      privileged: false
      workdir_parent: /workspace
      valid_volumes: []
      require_docker: true
      docker_timeout: 60s
      options: "--cpus=1.5 --memory=3g"
